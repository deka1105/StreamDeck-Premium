name: CI

on:
  push:
    branches: [panel-parity]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Tests never launch Electron; skip its ~100 MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # Windows: build the native helper (NativeAOT) and run its own checks,
      # then the host tests talk to the real .exe.
      - if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - if: runner.os == 'Windows'
        name: Build the Windows helper
        working-directory: desktop/native/win-helper
        run: |
          dotnet publish -c Release -r win-x64 -o out
          ./out/DeskAssistHelper.exe --selftest
      - run: npm test

  panel:
    name: Panel, editor and browser tests
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Panel unit tests
        working-directory: panel
        run: npm ci && npm test
      - name: Built panel matches its source
        run: |
          (cd panel && npm run build)
          git diff --exit-code -- panel/dist mobile/src/generated || (echo "::error::Run 'npm run build' in panel/ and commit the output." && exit 1)
      - name: Host dependencies (the browser tests start a real host)
        working-directory: desktop
        run: npm ci
      - name: Browser tests
        working-directory: tools/ui-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
