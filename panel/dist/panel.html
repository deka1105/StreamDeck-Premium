<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DeskAssist panel</title>
<style>/* DeskAssist panel. Palette mirrors mobile/src/theme.ts. */
:root {
  --bg: #070b14;
  --surface: #0e1626;
  --field: #16233a;
  --line: rgba(255, 255, 255, 0.09);
  --ink: #e8eef9;
  --ink-mid: #cdd7e8;
  --ink-dim: #8a99b2;
  --ink-faint: #6b7a94;
  --accent: #38bdf8;
  --accent-soft: #7dd3fc;
  --accent-faint: rgba(56, 189, 248, 0.16);
  --success: #34d399;
  --danger: #fb7185;
  --warn: #fbbf24;
  --radius: 16px;
  --gap: 8px;
  --pad: 12px;
  --page-pad: 10px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  touch-action: manipulation;
}

:root { --nav-h: 18px; }

#pages {
  position: absolute;
  inset: 0;
  overflow: hidden;
  touch-action: pan-y;
}

.page {
  position: absolute;
  inset: 0;
  padding: var(--page-pad);
  padding-top: max(var(--page-pad), env(safe-area-inset-top));
  padding-bottom: calc(max(var(--page-pad), env(safe-area-inset-bottom)) + var(--nav-h));
  padding-left: max(var(--page-pad), env(safe-area-inset-left));
  padding-right: max(var(--page-pad), env(safe-area-inset-right));
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  will-change: transform;
}
.page.dragging { transition: none; }

.page-grid {
  display: grid;
  gap: var(--gap);
  width: 100%;
  height: 100%;
}

.empty {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-faint);
  font-size: 14px;
  text-align: center;
  padding: 24px;
}

/* Portrait pages may be taller than the screen: let them scroll. */
@media (orientation: portrait) {
  .page { overflow-y: auto; }
  .page-grid { height: auto; min-height: 100%; grid-auto-rows: calc((100vh - 2 * var(--page-pad) - var(--nav-h)) / 12); }
}

/* --- page dots --- */
#dots {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: max(2px, env(safe-area-inset-bottom));
  height: var(--nav-h);
  display: flex;
  align-items: center;
  gap: 2px;
  z-index: 10;
}
#dots[hidden] { display: none; }
.dot {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 6px 5px;
  cursor: pointer;
}
.dot::after {
  content: "";
  display: block;
  width: 6px;
  height: 6px;
  border-radius: 99px;
  background: var(--ink-faint);
  opacity: 0.55;
  transition: width 0.2s, background 0.2s, opacity 0.2s;
}
.dot[aria-current="page"]::after { width: 16px; background: var(--accent); opacity: 1; }

/* --- page overview --- */
#overview {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(7, 11, 20, 0.86);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  padding: max(20px, env(safe-area-inset-top)) 20px 20px;
  overflow-y: auto;
}
#overview[hidden] { display: none; }
.ov-title { color: var(--ink-dim); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.ov-card {
  appearance: none;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  color: var(--ink);
  font: inherit;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
}
.ov-card[aria-current="page"] { border-color: var(--accent); background: var(--accent-faint); }
.ov-name { font-weight: 650; font-size: 15px; }
.ov-meta { color: var(--ink-faint); font-size: 12px; }

/* --- demo label --- */
#banner {
  position: fixed;
  top: max(4px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--warn);
  background: rgba(251, 191, 36, 0.12);
  border: 1px solid rgba(251, 191, 36, 0.3);
  border-radius: 99px;
  padding: 2px 10px;
  pointer-events: none;
}
#banner[hidden] { display: none; }

.w {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.w-body {
  position: absolute;
  inset: 0;
  padding: var(--pad);
  container-type: size;
  display: flex;
  flex-direction: column;
}

.w-missing {
  align-items: center;
  justify-content: center;
  color: var(--ink-faint);
  font-size: 12px;
  text-align: center;
}

/* --- status dot --- */
#status {
  position: fixed;
  top: max(6px, env(safe-area-inset-top));
  right: max(8px, env(safe-area-inset-right));
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ink-faint);
  z-index: 20;
  opacity: 0.8;
}
#status[data-online="1"] { background: var(--success); }
#status[data-online="0"] { background: var(--danger); }

/* --- clock --- */
.w-clock { justify-content: center; align-items: center; text-align: center; }
.clock-time {
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  font-size: clamp(18px, min(38cqh, 17cqw), 220px);
  line-height: 1;
}
.clock-date {
  margin-top: 4cqh;
  color: var(--ink-dim);
  font-size: clamp(11px, min(11cqh, 6cqw), 40px);
}

/* --- metric --- */
.w-metric { justify-content: space-between; }
.metric-label {
  color: var(--ink-dim);
  font-size: clamp(11px, min(14cqh, 9cqw), 28px);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.metric-value {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  line-height: 1;
}
.metric-value .num { font-size: clamp(20px, min(42cqh, 28cqw), 160px); }
.metric-value .unit { font-size: clamp(12px, min(18cqh, 12cqw), 60px); color: var(--ink-dim); margin-left: 2px; }
.metric-bar {
  height: max(4px, 5cqh);
  border-radius: 99px;
  background: var(--field);
  overflow: hidden;
}
.metric-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: inherit;
  transition: width 0.6s ease;
}
.w-metric[data-level="mid"] .metric-fill { background: var(--warn); }
.w-metric[data-level="high"] .metric-fill { background: var(--danger); }
</style>
</head>
<body>
<div id="status"></div>
<div id="banner" hidden></div>
<div id="pages"></div>
<nav id="dots" hidden></nav>
<div id="overview" hidden></div>
