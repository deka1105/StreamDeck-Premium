<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DeskAssist panel</title>
<style>/* DeskAssist panel. Palette mirrors mobile/src/theme.ts. */
:root {
  --bg: #070b14;
  --surface: #0e1626;
  --field: #16233a;
  --line: rgba(255, 255, 255, 0.09);
  --ink: #e8eef9;
  --ink-mid: #cdd7e8;
  --ink-dim: #8a99b2;
  --ink-faint: #6b7a94;
  --accent: #38bdf8;
  --accent-soft: #7dd3fc;
  --accent-faint: rgba(56, 189, 248, 0.16);
  --success: #34d399;
  --danger: #fb7185;
  --warn: #fbbf24;
  --radius: 16px;
  --gap: 8px;
  --pad: 12px;
  --page-pad: 10px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  touch-action: manipulation;
}

:root { --nav-h: 18px; }

#pages {
  position: absolute;
  inset: 0;
  overflow: hidden;
  touch-action: pan-y;
}

.page {
  position: absolute;
  inset: 0;
  padding: var(--page-pad);
  padding-top: max(var(--page-pad), env(safe-area-inset-top));
  padding-bottom: calc(max(var(--page-pad), env(safe-area-inset-bottom)) + var(--nav-h));
  padding-left: max(var(--page-pad), env(safe-area-inset-left));
  padding-right: max(var(--page-pad), env(safe-area-inset-right));
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  will-change: transform;
}
.page.dragging { transition: none; }

.page-grid {
  display: grid;
  gap: var(--gap);
  width: 100%;
  height: 100%;
}

.empty {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-faint);
  font-size: 14px;
  text-align: center;
  padding: 24px;
}

/* Portrait pages may be taller than the screen: let them scroll. */
@media (orientation: portrait) {
  .page { overflow-y: auto; }
  .page-grid { height: auto; min-height: 100%; grid-auto-rows: calc((100vh - 2 * var(--page-pad) - var(--nav-h)) / 12); }
}

/* --- page dots --- */
#dots {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: max(2px, env(safe-area-inset-bottom));
  height: var(--nav-h);
  display: flex;
  align-items: center;
  gap: 2px;
  z-index: 10;
}
#dots[hidden] { display: none; }
.dot {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 6px 5px;
  cursor: pointer;
}
.dot::after {
  content: "";
  display: block;
  width: 6px;
  height: 6px;
  border-radius: 99px;
  background: var(--ink-faint);
  opacity: 0.55;
  transition: width 0.2s, background 0.2s, opacity 0.2s;
}
.dot[aria-current="page"]::after { width: 16px; background: var(--accent); opacity: 1; }

/* --- page overview --- */
#overview {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(7, 11, 20, 0.86);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  padding: max(20px, env(safe-area-inset-top)) 20px 20px;
  overflow-y: auto;
}
#overview[hidden] { display: none; }
.ov-title { color: var(--ink-dim); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.ov-card {
  appearance: none;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  color: var(--ink);
  font: inherit;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
}
.ov-card[aria-current="page"] { border-color: var(--accent); background: var(--accent-faint); }
.ov-name { font-weight: 650; font-size: 15px; }
.ov-meta { color: var(--ink-faint); font-size: 12px; }

/* --- demo label --- */
#banner {
  position: fixed;
  top: max(4px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--warn);
  background: rgba(251, 191, 36, 0.12);
  border: 1px solid rgba(251, 191, 36, 0.3);
  border-radius: 99px;
  padding: 2px 10px;
  pointer-events: none;
}
#banner[hidden] { display: none; }

.w {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.w-body {
  position: absolute;
  inset: 0;
  padding: var(--pad);
  container-type: size;
  display: flex;
  flex-direction: column;
}

.w-missing {
  align-items: center;
  justify-content: center;
  color: var(--ink-faint);
  font-size: 12px;
  text-align: center;
}

/* --- status dot --- */
#status {
  position: fixed;
  top: max(6px, env(safe-area-inset-top));
  right: max(8px, env(safe-area-inset-right));
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ink-faint);
  z-index: 20;
  opacity: 0.8;
}
#status[data-online="1"] { background: var(--success); }
#status[data-online="0"] { background: var(--danger); }

/* --- clock --- */
.w-clock { justify-content: center; align-items: center; text-align: center; }
.clock-time {
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  font-size: clamp(18px, min(38cqh, 17cqw), 220px);
  line-height: 1;
}
.clock-date {
  margin-top: 4cqh;
  color: var(--ink-dim);
  font-size: clamp(11px, min(11cqh, 6cqw), 40px);
}

/* --- metric --- */
.w-metric { justify-content: space-between; }
.metric-label {
  color: var(--ink-dim);
  font-size: clamp(11px, min(14cqh, 9cqw), 28px);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.metric-value {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  line-height: 1;
}
.metric-value .num { font-size: clamp(20px, min(42cqh, 28cqw), 160px); }
.metric-value .unit { font-size: clamp(12px, min(18cqh, 12cqw), 60px); color: var(--ink-dim); margin-left: 2px; }
.metric-bar {
  height: max(4px, 5cqh);
  border-radius: 99px;
  background: var(--field);
  overflow: hidden;
}
.metric-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: inherit;
  transition: width 0.6s ease;
}
.w-metric[data-level="mid"] .metric-fill { background: var(--warn); }
.w-metric[data-level="high"] .metric-fill { background: var(--danger); }

/* --- deck tiles --- */
.w .w-deck { padding: calc(var(--pad) * 0.6); }
.deck-grid { flex: 1; display: grid; gap: 6px; min-height: 0; }
.deck-msg { margin: auto; color: var(--ink-faint); font-size: 12px; text-align: center; max-width: 30em; }
.deck-tile {
  appearance: none;
  border: 0;
  border-radius: 12px;
  background: var(--tile);
  color: #fff;
  font: inherit;
  min-width: 0;
  min-height: 0;
  container-type: size;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4%;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 2px 6px rgba(0, 0, 0, 0.3);
  transition: transform 0.12s ease, filter 0.2s;
}
.deck-tile.pressed { transform: scale(0.93); filter: brightness(1.15); }
.deck-tile[data-result="fail"] { box-shadow: 0 0 0 2px var(--danger); }
.deck-icon { font-size: clamp(14px, 38cqmin, 56px); line-height: 1; }
.deck-icon img { width: 1.1em; height: 1.1em; object-fit: contain; display: block; }
.deck-label {
  font-size: clamp(9px, 13cqmin, 15px);
  font-weight: 650;
  max-width: 92%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
}

/* --- shared list widgets --- */
.w-title { color: var(--ink-dim); font-size: clamp(10px, 4.5cqmin, 14px); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.w-list .list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.muted { color: var(--ink-faint); }
.minibar { height: 5px; border-radius: 99px; background: var(--field); overflow: hidden; margin-top: 4px; }
.minibar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width 0.6s ease; }
[data-level="mid"] .minibar > i { background: var(--warn); }
[data-level="high"] .minibar > i { background: var(--danger); }
.w-metric[data-na="1"] .num { color: var(--ink-faint); }

/* --- gauge --- */
.w-gauge { align-items: center; justify-content: center; } /* .w-body is already absolutely positioned */
.gauge-svg { width: 100%; height: 100%; }
.gauge-svg circle { fill: none; stroke-width: 9; stroke-linecap: round; }
.gauge-track { stroke: var(--field); }
.gauge-fill { stroke: var(--accent); transition: stroke-dasharray 0.6s ease; }
.w-gauge[data-level="mid"] .gauge-fill { stroke: var(--warn); }
.w-gauge[data-level="high"] .gauge-fill { stroke: var(--danger); }
.gauge-center { position: absolute; inset: var(--pad); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.gauge-num { font-weight: 700; font-variant-numeric: tabular-nums; }
.gauge-num .num { font-size: clamp(16px, 22cqmin, 80px); }
.gauge-num .unit { font-size: clamp(10px, 9cqmin, 30px); color: var(--ink-dim); margin-left: 1px; }
.gauge-label { color: var(--ink-dim); font-size: clamp(9px, 7cqmin, 18px); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

/* --- chart --- */
.w-chart { gap: 4px; }
.chart-head { display: flex; gap: 12px; flex-wrap: wrap; font-size: clamp(10px, 6cqh, 14px); }
.chart-key b { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.chart-key.s0 b { background: var(--accent); }
.chart-key.s1 b { background: #c084fc; }
.chart-name { color: var(--ink-dim); }
.chart-val { font-weight: 650; font-variant-numeric: tabular-nums; }
.chart-svg, .net-chart { flex: 1; width: 100%; min-height: 0; }
.chart-line { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.chart-line.s0 { stroke: var(--accent); }
.chart-line.s1 { stroke: #c084fc; }
.chart-area { stroke: none; }
.chart-area.s0 { fill: rgba(56, 189, 248, 0.14); }
.chart-area.s1 { fill: rgba(192, 132, 252, 0.12); }

/* --- gpu / storage --- */
.gpu-card { background: var(--field); border-radius: 10px; padding: 8px 10px; }
.gpu-name { font-weight: 650; font-size: 13px; margin-bottom: 4px; }
.kv { display: grid; grid-template-columns: 1fr auto; font-size: 12px; margin-top: 3px; }
.kv .k { color: var(--ink-dim); }
.kv .minibar { grid-column: 1 / -1; }
.store-top { display: flex; justify-content: space-between; gap: 8px; font-size: clamp(11px, 4cqmin, 14px); }
.store-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.store-val { color: var(--ink-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* --- processes --- */
.w-procs .list { gap: 2px; }
.proc-row { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 5px 4px; border-radius: 6px; text-align: left; font-size: clamp(11px, 4cqmin, 14px); }
.w-processes .proc-row { cursor: pointer; }
.w-processes .proc-row:active { background: var(--field); }
.proc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proc-count { color: var(--ink-faint); }
.proc-val { font-variant-numeric: tabular-nums; color: var(--ink-mid); }
.proc-sheet { position: absolute; inset: 0; background: rgba(14, 22, 38, 0.97); padding: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
.proc-sheet[hidden] { display: none; }
.sheet-title { font-weight: 700; font-size: 16px; }
.sheet-msg { font-size: 13px; color: var(--ink-mid); min-height: 1.2em; }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.sheet-btn { appearance: none; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 10px; }
.sheet-btn.danger { color: #fff; background: #be123c; border-color: transparent; }

/* --- internet --- */
.w-internet { gap: 6px; }
.net-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: clamp(12px, 6cqh, 18px); }
.net-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-faint); }
.w-internet[data-state="up"] .net-dot { background: var(--success); }
.w-internet[data-state="down"] .net-dot { background: var(--danger); }
.net-ip { margin-left: auto; font-weight: 500; font-size: 12px; }
.net-stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.net-stats > div { display: flex; flex-direction: column; }
.net-stats .k { color: var(--ink-faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
.net-stats .v { font-weight: 650; font-variant-numeric: tabular-nums; font-size: clamp(11px, 5cqh, 16px); white-space: nowrap; }
.net-foot { display: flex; align-items: center; gap: 10px; font-size: 11px; }
.net-up, .net-speed { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.net-speed { flex: 1; text-align: right; }
.net-test { flex: none; }
@container (max-width: 420px) { .net-speed { display: none; } .net-up { flex: 1; } }
.net-test { appearance: none; border: 1px solid var(--line); background: var(--field); color: var(--accent-soft); font: inherit; font-weight: 650; padding: 4px 10px; border-radius: 8px; }
@container (max-height: 120px) { .w-internet .net-chart, .w-internet .net-foot { display: none; } }
@container (max-width: 260px) { .net-stats > div:nth-child(n+4) { display: none; } .net-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* --- shared buttons --- */
.tbtn { appearance: none; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; font-weight: 650; font-size: clamp(11px, 4.5cqmin, 15px); padding: 6px 12px; border-radius: 10px; cursor: pointer; }
.tbtn.primary { background: var(--accent); color: #04121c; border-color: transparent; }
.tbtn.preset { padding: 4px 9px; font-size: clamp(10px, 4cqmin, 13px); }
.t-ctrls { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }

/* --- clock status / analog / word clock --- */
.clock-status { margin-top: 3cqh; font-size: clamp(10px, 8cqh, 18px); }
.w-analog { align-items: center; justify-content: center; }
.analog-svg { width: 100%; height: 100%; }
.analog-svg .face { fill: var(--field); stroke: var(--line); }
.analog-svg .ticks line { stroke: var(--ink-faint); stroke-width: 1.6; stroke-linecap: round; }
.analog-svg .hand { stroke: var(--ink); stroke-linecap: round; }
.analog-svg .hand.h { stroke-width: 3.6; }
.analog-svg .hand.m { stroke-width: 2.4; }
.analog-svg .hand.s { stroke: var(--accent); stroke-width: 1.1; }
.analog-svg .hub { fill: var(--accent); }
.analog-label { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; color: var(--ink-dim); font-size: 11px; }
.w-wordclock { align-items: center; justify-content: center; }
.wc-grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 0.6cqmin; width: 100%; height: 100%; font-weight: 700; font-size: clamp(8px, 6.5cqmin, 30px); text-align: center; align-content: space-evenly; }
.wc-grid span { color: rgba(255, 255, 255, 0.1); transition: color 0.6s; }
.wc-grid span.on { color: var(--ink); text-shadow: 0 0 12px rgba(56, 189, 248, 0.45); }

/* --- world clocks / calendar --- */
.world-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: baseline; font-size: clamp(12px, 5cqmin, 18px); }
.world-time { font-weight: 700; font-variant-numeric: tabular-nums; }
.world-day { font-size: 0.75em; }
.w-calendar { gap: 4px; }
.cal-title { font-weight: 700; font-size: clamp(12px, 5cqmin, 18px); }
.cal-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); align-content: space-evenly; text-align: center; font-size: clamp(10px, 4.5cqmin, 16px); font-variant-numeric: tabular-nums; }
.cal-h { color: var(--ink-faint); font-weight: 700; }
.cal-d.out { color: var(--ink-faint); opacity: 0.5; }
.cal-d.today { background: var(--accent); color: #04121c; font-weight: 800; border-radius: 99px; }

/* --- countdown / timer / stopwatch / pomodoro --- */
.w-countdown { justify-content: center; text-align: center; }
.cd-title { color: var(--ink-dim); font-weight: 650; font-size: clamp(11px, 9cqh, 18px); }
.cd-big { font-weight: 800; font-size: clamp(18px, 26cqh, 72px); line-height: 1.1; }
.cd-small { font-size: clamp(10px, 8cqh, 15px); }
.w-timer, .w-stopwatch, .w-pomodoro { align-items: center; justify-content: space-between; gap: 4px; text-align: center; }
.t-label { font-size: 12px; min-height: 0; }
.t-ring { position: relative; flex: 1; min-height: 0; aspect-ratio: 1; }
.t-ring svg { width: 100%; height: 100%; }
.t-track, .t-fill { fill: none; stroke-width: 6; }
.t-track { stroke: var(--field); }
.t-fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.3s linear; }
.w-timer[data-state="paused"] .t-fill { stroke: var(--warn); }
.t-time { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-variant-numeric: tabular-nums; font-size: clamp(14px, 13cqmin, 56px); }
.t-presets { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.w-timer[data-state="running"] .t-presets { display: none; }
.sw-time, .po-time { font-weight: 800; font-variant-numeric: tabular-nums; font-size: clamp(20px, 22cqmin, 80px); margin: auto 0; }
.sw-laps { font-size: 11px; min-height: 1em; }
.po-phase { font-weight: 700; color: var(--accent-soft); font-size: clamp(11px, 6cqmin, 16px); }
.w-pomodoro[data-phase="short"] .po-phase, .w-pomodoro[data-phase="long"] .po-phase { color: var(--success); }
.po-dots { letter-spacing: 4px; color: var(--accent); font-size: 12px; }
.w-focushist .fh-bars { flex: 1; display: flex; gap: 6px; align-items: stretch; }
.fh-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; font-size: 10px; color: var(--ink-faint); }
.fh-bar { width: 100%; min-height: 2px; background: var(--accent); border-radius: 4px 4px 2px 2px; }

/* --- personal --- */
.note-text { flex: 1; width: 100%; resize: none; border: 0; outline: none; background: transparent; color: var(--ink); font: inherit; font-size: clamp(12px, 5cqmin, 18px); line-height: 1.4; -webkit-user-select: text; user-select: text; }
.cl-row { display: flex; gap: 10px; align-items: center; font-size: clamp(12px, 5cqmin, 17px); padding: 3px 0; }
.cl-row input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.cl-row.done span { color: var(--ink-faint); text-decoration: line-through; }
.w-counter { align-items: center; justify-content: space-between; text-align: center; }
.ct-row { display: flex; align-items: center; gap: 4cqmin; }
.ct-num { font-weight: 800; font-size: clamp(22px, 26cqmin, 90px); font-variant-numeric: tabular-nums; min-width: 2ch; }
.ct-reset { background: none; border: 0; font: inherit; font-size: 11px; }
.w-breathe { align-items: center; justify-content: center; }
.br-circle { width: 70cqmin; height: 70cqmin; border-radius: 50%; background: radial-gradient(circle, rgba(56, 189, 248, 0.5), rgba(56, 189, 248, 0.08)); transform: scale(0.45); transition-property: transform; transition-timing-function: ease-in-out; }
.br-text { position: absolute; font-weight: 700; font-size: clamp(12px, 7cqmin, 24px); }
.w-quote { justify-content: center; }
.q-text { margin: 0; font-size: clamp(12px, min(11cqh, 6cqw), 26px); line-height: 1.35; font-style: italic; }
.q-by { margin-top: 6px; font-size: clamp(10px, 7cqh, 14px); }
.w-titletext { justify-content: center; font-weight: 800; white-space: nowrap; overflow: hidden; }
/* Sized on a child: container units on the container itself would resolve against the viewport. */
.w-titletext > .title-text, .w-titletext .marquee-track { font-size: clamp(14px, min(52cqh, 14cqw), 80px); line-height: 1.15; }
.w-titletext > .title-text { overflow: hidden; text-overflow: ellipsis; }
.w-titletext[data-align="center"] { text-align: center; }
.w.bare { background: transparent; border-color: transparent; }
.w-battery { align-items: center; justify-content: center; gap: 4px; }
.bat-icon { width: 46%; height: 22%; border: 2px solid var(--ink-dim); border-radius: 6px; padding: 2px; position: relative; }
.bat-icon::after { content: ""; position: absolute; right: -6px; top: 30%; width: 3px; height: 40%; background: var(--ink-dim); border-radius: 0 2px 2px 0; }
.bat-icon i { display: block; height: 100%; background: var(--success); border-radius: 3px; }
.w-battery[data-level="low"] .bat-icon i { background: var(--danger); }
.bat-pct { font-weight: 800; font-size: clamp(14px, 18cqmin, 40px); }
.bat-state { font-size: 11px; }
.pc-row { appearance: none; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 10px; text-align: left; }
.pc-row.active { border-color: var(--accent); }
.pc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); }
.pc-row.active .pc-dot { background: var(--success); }
.pc-name { flex: 1; font-weight: 650; }

/* --- alarm card + running-timer badge --- */
#alarm { position: fixed; inset: 0; z-index: 40; background: rgba(7, 11, 20, 0.88); display: flex; align-items: center; justify-content: center; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
#alarm[hidden] { display: none; }
.alarm-card { background: var(--surface); border: 1px solid var(--accent); border-radius: 22px; padding: 26px 34px; text-align: center; animation: alarm-pulse 1.2s ease-in-out infinite; }
.alarm-icon { font-size: 44px; }
.alarm-title { font-weight: 800; font-size: 26px; margin: 6px 0 2px; }
.alarm-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
@keyframes alarm-pulse { 50% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0.15); } }
#timerBadge { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(2px, env(safe-area-inset-bottom)) + var(--nav-h) + 2px); z-index: 11; appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 99px; font-variant-numeric: tabular-nums; }
#timerBadge[hidden] { display: none; }

/* --- Stage 6: weather & web --- */
.setup { margin: auto; text-align: center; font-size: clamp(11px, 4cqmin, 14px); padding: 6px; }
.stale { position: absolute; right: 8px; bottom: 5px; font-size: 9px; color: var(--warn); opacity: 0.85; }
.w-weather { justify-content: center; gap: 2px; }
.wx-main { display: flex; align-items: center; gap: 4cqmin; }
.wx-icon { font-size: clamp(20px, 30cqmin, 90px); line-height: 1; }
.wx-temp { font-weight: 800; font-size: clamp(22px, 32cqmin, 110px); font-variant-numeric: tabular-nums; line-height: 1; }
.wx-words { font-weight: 650; font-size: clamp(11px, 9cqh, 18px); }
.wx-place { font-size: clamp(10px, 7cqh, 14px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@container (max-height: 90px) { .wx-words, .wx-place { display: none; } }
.fc-row { flex: 1; display: flex; gap: 4px; }
.fc-cell { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; font-size: clamp(10px, 8cqh, 15px); }
.fc-icon { font-size: clamp(16px, 22cqh, 40px); }
.sm-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; align-content: space-evenly; font-size: clamp(10px, 7cqh, 14px); }
.sm-grid > div { display: flex; flex-direction: column; }
.sm-grid b { font-size: 1.15em; }
.sm-moon { grid-column: 3; grid-row: 1 / span 2; align-items: center; text-align: center; gap: 4px; }
.sm-moon .moon-svg { width: 60%; max-width: 70px; }
.moon-svg .moon-dark { fill: #1e293b; }
.moon-svg .moon-lit { fill: #f1f5f9; }
.w-moon { align-items: center; justify-content: center; text-align: center; gap: 4px; }
.w-moon .moon-svg { height: 55%; }
.moon-name { font-weight: 700; font-size: clamp(11px, 8cqmin, 18px); }
.moon-sub { font-size: clamp(9px, 6cqmin, 13px); }
.w-air { justify-content: center; gap: 6px; }
.air-top { display: flex; align-items: baseline; gap: 10px; }
.air-num { font-weight: 800; font-size: clamp(22px, 30cqmin, 80px); }
.air-word { font-weight: 700; }
.w-air[data-band="0"] .air-num { color: var(--success); }
.w-air[data-band="1"] .air-num, .w-air[data-band="2"] .air-num { color: var(--warn); }
.w-air[data-band="3"] .air-num, .w-air[data-band="4"] .air-num, .w-air[data-band="5"] .air-num { color: var(--danger); }
.air-parts { font-size: clamp(9px, 6cqh, 13px); }
.chg { font-size: 0.8em; margin-left: 4px; }
.chg.up { color: var(--success); }
.chg.down { color: var(--danger); }
.credit { font-size: 9px; margin-top: 4px; }
.news-row { display: flex; flex-direction: column; gap: 1px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.news-row:last-child { border-bottom: 0; }
.news-title { font-size: clamp(11px, 4.5cqmin, 15px); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.news-meta { font-size: 10px; }
.w-news .news-row.opening { opacity: 0.5; }
.w-image { padding: 0 !important; }
.w-image img { width: 100%; height: 100%; display: block; }
.img-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; font-size: 12px; pointer-events: none; }
.img-msg:empty { display: none; }
.ag-day { font-size: 11px; font-weight: 700; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
.ag-row { display: grid; grid-template-columns: 4px max-content 1fr; gap: 8px; align-items: center; font-size: clamp(11px, 4.5cqmin, 15px); }
.ag-time { white-space: nowrap; min-width: 4.2em; }
.ag-row i { height: 1.2em; border-radius: 2px; }
.ag-time { color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.ag-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.w-nextup { justify-content: center; gap: 2px; }
.nu-when { font-weight: 700; font-size: clamp(11px, 10cqh, 16px); }
.nu-title { font-weight: 800; font-size: clamp(14px, 20cqh, 32px); line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nu-loc { font-size: clamp(10px, 8cqh, 14px); }
.dot[data-badge="1"]::before { content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--badge, var(--accent)); margin: -4px 0 0 6px; }
.dot { position: relative; }

/* --- Stage 7: media --- */
.mbtn { appearance: none; border: 0; background: var(--field); color: var(--ink); font-size: clamp(14px, 7cqmin, 22px); width: 2.2em; height: 2.2em; border-radius: 50%; cursor: pointer; line-height: 1; }
.mbtn.big { background: var(--accent); color: #04121c; width: 2.6em; height: 2.6em; }
.w-nowplaying { flex-direction: row; gap: 12px; align-items: stretch; }
.np-art { flex: none; aspect-ratio: 1; height: 100%; max-width: 45%; border-radius: 12px; background: var(--field) radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 0.25), transparent 60%); overflow: hidden; }
.np-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.np-art img:not([src]) { display: none; }
.np-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.np-app { font-size: 11px; }
.np-title { font-weight: 800; font-size: clamp(14px, 11cqh, 30px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-artist { font-size: clamp(11px, 7cqh, 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-seek { height: 6px; border-radius: 99px; background: var(--field); overflow: hidden; margin-top: 6px; cursor: pointer; }
.np-fill { height: 100%; background: var(--accent); border-radius: inherit; transition: width 0.5s linear; }
.np-times { display: flex; justify-content: space-between; font-size: 10px; font-variant-numeric: tabular-nums; }
.np-ctrls { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 4px; }
.np-vol, .vol-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.np-vol input, .vol-row input { flex: 1; accent-color: var(--accent); }
.np-vol .mbtn, .vol-row .mbtn { width: 1.9em; height: 1.9em; font-size: 15px; }
.w-volume { justify-content: center; }
.vol-num { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 3ch; text-align: right; }
.w-nowplaying[data-state="idle"] .np-seek, .w-nowplaying[data-state="idle"] .np-times { visibility: hidden; }
@container (max-height: 120px) { .np-art, .np-vol, .np-times { display: none; } }
.rd-row { appearance: none; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; display: flex; gap: 10px; padding: 7px 10px; border-radius: 10px; text-align: left; }
.rd-row.on { border-color: var(--accent); }
.rd-msg { font-size: 11px; margin-top: 4px; }
.w-lyrics { padding-left: 14px !important; padding-right: 14px !important; }
.ly-lines { flex: 1; overflow-y: auto; scroll-behavior: smooth; mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent); padding: 40% 0; }
.ly-line { font-weight: 700; font-size: clamp(13px, 6cqmin, 24px); color: var(--ink-faint); padding: 4px 0; transition: color 0.3s, transform 0.3s; transform-origin: left center; }
.ly-line.on { color: var(--ink); transform: scale(1.04); }
.ly-msg { text-align: center; margin: auto; }
.ly-plain { white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
.ms-row { display: flex; gap: 12px; height: 100%; }
.ms-poster { flex: none; height: 100%; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; background: var(--field); }
.ms-poster img { width: 100%; height: 100%; object-fit: cover; }
.ms-poster img:not([src]) { display: none; }
.ms-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.ms-head { font-size: 12px; }
.ms-dev, .ms-lib { font-size: 11px; }
.tag { font-size: 10px; padding: 1px 6px; border-radius: 99px; background: var(--accent-faint); color: var(--accent-soft); }

/* --- Stage 8: automation --- */
.w-push { justify-content: center; gap: 3px; }
.push-value { font-weight: 800; font-size: clamp(18px, min(30cqh, 18cqw), 70px); line-height: 1.05; color: var(--push, var(--ink)); }
.push-unit { font-size: 0.45em; color: var(--ink-dim); margin-left: 3px; }
.push-sub, .push-at, .push-empty { font-size: clamp(10px, 7cqh, 13px); }
.w-push[data-level="ok"] .push-num { color: var(--success); }
.w-push[data-level="warn"] .push-num { color: var(--warn); }
.w-push[data-level="error"] .push-num { color: var(--danger); }
.push-ring { position: absolute; inset: var(--pad); width: calc(100% - 2 * var(--pad)); height: calc(100% - 2 * var(--pad)); }
.push-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.note-row { display: flex; flex-direction: column; gap: 1px; padding: 5px 0 5px 9px; border-left: 3px solid var(--accent); font-size: clamp(11px, 4.5cqmin, 14px); }
.note-row[data-level="ok"] { border-color: var(--success); }
.note-row[data-level="warn"] { border-color: var(--warn); }
.note-row[data-level="error"] { border-color: var(--danger); }
.note-row .muted { font-size: 10px; }
.kv[data-level="error"] .v { color: var(--danger); }
.kv[data-level="ok"] .v { color: var(--success); }
.w-bigbutton { padding: calc(var(--pad) * 0.5) !important; }
.sc-key { appearance: none; border: 0; border-radius: 14px; background: var(--tile); color: #fff; font: inherit; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4%; container-type: size; cursor: pointer; transition: transform 0.12s, box-shadow 0.2s; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18); }
.sc-key.pressed { transform: scale(0.94); }
.sc-key.on { box-shadow: 0 0 0 3px var(--accent), inset 0 1px 0 rgba(255, 255, 255, 0.18); }
.sc-key[data-result="fail"] { box-shadow: 0 0 0 2px var(--danger); }
.cmd-out { flex: 1; margin: 0; overflow: auto; font: 11px/1.4 var(--mono); color: var(--ink-mid); white-space: pre-wrap; }
.cmd-at { font-size: 10px; }
.w-rules { justify-content: space-between; }
.rules-state { font-weight: 700; }
.w-custom { padding: 0 !important; }
.w-custom iframe { width: 100%; height: 100%; border: 0; background: transparent; }

#switch { position: fixed; inset: 0; z-index: 35; display: flex; align-items: flex-end; justify-content: center; padding-bottom: calc(var(--nav-h) + 16px); pointer-events: none; }
#switch[hidden] { display: none; }
.sw-card { pointer-events: auto; background: var(--surface); border: 1px solid var(--accent); border-radius: 18px; padding: 12px 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); text-align: center; min-width: 260px; }
.sw-why { font-size: 11px; color: var(--accent-soft); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.sw-text { font-weight: 700; margin: 4px 0 10px; }
.sw-actions { display: flex; gap: 8px; justify-content: center; }
#toasts { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 10px; z-index: 38; display: flex; flex-direction: column; gap: 8px; max-width: min(360px, 80vw); pointer-events: none; }
.toast { pointer-events: auto; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); animation: toast-in 0.25s ease; transition: opacity 0.4s, transform 0.4s; }
.toast[data-level="ok"] { border-left-color: var(--success); }
.toast[data-level="warn"] { border-left-color: var(--warn); }
.toast[data-level="error"] { border-left-color: var(--danger); }
.toast.out { opacity: 0; transform: translateX(20px); }
.toast span { font-size: 13px; color: var(--ink-mid); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } }

/* --- Stage 9: AI & code --- */
.sess-row, .pr-row { appearance: none; background: none; border: 0; color: inherit; font: inherit; text-align: left; display: flex; align-items: center; gap: 8px; padding: 6px 2px; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; font-size: clamp(11px, 4.5cqmin, 14px); }
.sess-row .grow, .pr-row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-dim); flex: none; }
.sess-row[data-state="working"] .sess-dot { background: var(--success); animation: pulse 1.4s ease-in-out infinite; }
.sess-row[data-state="permission"] .sess-dot, .sess-row[data-state="question"] .sess-dot { background: var(--warn); }
.sess-row[data-state="input"] .sess-dot, .sess-row[data-state="finished"] .sess-dot { background: var(--accent); }
.sess-state { font-size: 11px; color: var(--ink-mid); white-space: nowrap; }
.sess-row[data-state="permission"] .sess-state { color: var(--warn); font-weight: 700; }
.sess-tok { font-size: 10px; min-width: 38px; text-align: right; }
@keyframes pulse { 50% { opacity: 0.35; } }
.w-quota { gap: 8px; }
.quota-row .minibar i { background: var(--success); }
.quota-row[data-level="warn"] .minibar i { background: var(--warn); }
.quota-row[data-level="error"] .minibar i { background: var(--danger); }
.quota-sub { font-size: 10px; margin-top: 2px; }
.tok-big { font-weight: 800; font-size: clamp(20px, 22cqh, 56px); line-height: 1.1; }
.tok-bars { flex: 1; display: flex; align-items: flex-end; gap: 4px; min-height: 20px; margin-top: 6px; }
.tok-bars i { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; opacity: 0.8; }
.tok-bars i:last-child { opacity: 1; }
.w-alerts[data-on="1"] { box-shadow: inset 0 0 0 2px var(--warn); }
.alerts-clear { color: var(--success); }
.contrib-grid { flex: 1; display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; min-height: 0; }
.contrib-grid i { border-radius: 2px; background: rgba(255, 255, 255, 0.06); }
.contrib-grid i[data-l="1"] { background: color-mix(in srgb, var(--success) 30%, transparent); }
.contrib-grid i[data-l="2"] { background: color-mix(in srgb, var(--success) 55%, transparent); }
.contrib-grid i[data-l="3"] { background: color-mix(in srgb, var(--success) 80%, transparent); }
.contrib-grid i[data-l="4"] { background: var(--success); }
.contrib-kinds { font-size: 10px; margin-top: 4px; }
.pr-badge { color: var(--warn); }
#prompts { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(0, 0, 0, 0.55); }
#prompts[hidden] { display: none; }
.prompt-card { background: var(--surface); border: 1px solid var(--warn); border-radius: 18px; padding: 14px 18px; width: min(520px, 90vw); box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6); text-align: center; }
.prompt-tool { font-weight: 800; font-size: 18px; margin-top: 4px; }
.prompt-detail { margin: 8px 0 12px; padding: 8px; background: #04070d; border-radius: 8px; font: 12px/1.4 var(--mono); white-space: pre-wrap; word-break: break-all; max-height: 30vh; overflow: auto; text-align: left; }
.prompt-left { font-size: 11px; margin-top: 8px; }
.prompt-allow, .prompt-deny { min-width: 120px; min-height: 44px; }

/* --- Stage 10: appearance & display --- */
.w { box-shadow: var(--tile-shadow, none); border: var(--tile-border, 1px solid var(--line)); }
#pages { transform: translate(var(--shift-x, 0), var(--shift-y, 0)); }
.page-grid { zoom: var(--scale, 1); width: calc(100% / var(--scale, 1)); height: calc(100% / var(--scale, 1)); }
body[data-theme="light"] { --line: rgba(15, 23, 42, 0.1); --field: #e2e8f0; color-scheme: light; }
body[data-theme="light"] .tbtn:not(.primary) { color: var(--ink); }
body[data-theme="oled"] { --line: rgba(255, 255, 255, 0.12); }
#wall { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
#wall[hidden] { display: none; }
.wall-img { position: absolute; inset: 0; background: center / cover no-repeat; }
.wall-dim { position: absolute; inset: 0; background: #000; }
body[data-wall="1"] { background: transparent; }
body[data-wall="1"] .w { -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }

/* navigation styles */
.dot-name { display: none; }
body[data-badges="0"] .dot[data-badge="1"]::before { display: none; }
body[data-nav="none"] #dots { display: none; }
body[data-nav="none"] { --nav-h: 0px; }
body[data-nav="bar"] { --nav-h: 38px; }
body[data-nav="bar"] #dots { left: 0; right: 0; transform: none; justify-content: center; gap: 6px; padding: 0 10px; height: 34px; overflow-x: auto; }
body[data-nav="bar"] .dot, body[data-nav^="side"] .dot { padding: 6px 12px; border-radius: 99px; color: var(--ink-dim); font: 600 12px var(--font); white-space: nowrap; }
body[data-nav="bar"] .dot::after, body[data-nav^="side"] .dot::after { display: none; }
body[data-nav="bar"] .dot-name, body[data-nav^="side"] .dot-name { display: inline; }
body[data-nav="bar"] .dot[aria-current="page"], body[data-nav^="side"] .dot[aria-current="page"] { background: var(--accent-faint); color: var(--accent); }
body[data-nav^="side"] { --nav-h: 0px; }
body[data-nav^="side"] #dots { flex-direction: column; top: 50%; bottom: auto; left: auto; height: auto; max-height: 90vh; overflow-y: auto; transform: translateY(-50%); gap: 4px; }
body[data-nav="side-left"] #dots { left: max(4px, env(safe-area-inset-left)); }
body[data-nav="side-right"] #dots { right: max(4px, env(safe-area-inset-right)); }
body[data-nav="side-left"] .page { padding-left: calc(max(var(--page-pad), env(safe-area-inset-left)) + var(--side-w, 96px)); }
body[data-nav="side-right"] .page { padding-right: calc(max(var(--page-pad), env(safe-area-inset-right)) + var(--side-w, 96px)); }
body[data-nav^="side"] .dot { width: calc(var(--side-w, 96px) - 8px); text-align: left; overflow: hidden; text-overflow: ellipsis; }

/* night screen, black screen, dimming */
#night { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
#night[hidden] { display: none; }
#night[data-style="black"] .night-clock { display: none; }
.night-clock { text-align: center; color: #fff; opacity: var(--night-b, 0.25); transform: translate(calc(var(--shift-x, 0px) * 6), calc(var(--shift-y, 0px) * 6)); transition: transform 2s; }
.night-time { font-size: min(28vw, 50vh); font-weight: 200; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.night-date { font-size: min(4vw, 7vh); margin-top: 1vh; color: #9aa4b2; }
#dim { position: fixed; inset: 0; z-index: 55; background: #000; pointer-events: none; transition: opacity 1.5s; }
#dim[hidden] { display: none; }

/* marquee */
.w-titletext.marquee { overflow: hidden; justify-content: flex-start !important; }
.marquee-track { display: flex; white-space: nowrap; width: max-content; }
.marquee-track.on { animation: marquee linear infinite; }
.marquee-track span { padding-right: 3em; }
@keyframes marquee { to { transform: translateX(-50%); } }

/* font families get a body hook (look.js sets --font) */
body[data-font="mono"] .w-title { letter-spacing: 0; }
.w-stack { padding: 0 !important; }
.stack-view { position: absolute; inset: 0 0 14px 0; }
.stack-view > .w-body { padding: var(--pad); }
.stack-dots { position: absolute; left: 0; right: 0; bottom: 3px; display: flex; justify-content: center; gap: 2px; }
.stack-dots i { width: 14px; height: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.stack-dots i::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--ink-faint); }
.stack-dots i[aria-current]::after { background: var(--accent); }
.tok-sub { font-size: clamp(10px, 4cqmin, 13px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-quota .quota-row { font-size: clamp(11px, 5cqmin, 14px); }
.w-quota { gap: 4px; overflow-y: auto; }
.w-quota .quota-sub { line-height: 1.25; }

/* --- Stage 11: Control Deck --- */
.cd-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.cd-head .w-title { margin-bottom: 0; }
.cd-msg { font-size: 11px; min-height: 0; color: var(--danger); }
.cd-msg:empty { display: none; }
.cd-btn { appearance: none; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; border-radius: 12px; padding: 6px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; min-height: 0; cursor: pointer; transition: transform 0.12s, background 0.2s, border-color 0.2s; }
.cd-btn:active, .ha-tile:active, .ibtn:active, .chip:active { transform: scale(0.95); }
.cd-btn .cd-ico { font-size: clamp(14px, 9cqmin, 24px); line-height: 1; }
.cd-btn .cd-lbl { font-size: clamp(10px, 4.2cqmin, 14px); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cd-btn.on { background: var(--accent-faint); border-color: var(--accent); color: var(--accent-soft); }
.cd-btn.rec, .cd-btn.live { background: color-mix(in srgb, var(--danger) 22%, transparent); border-color: var(--danger); color: #fecdd3; }
.cd-btn.armed { background: color-mix(in srgb, var(--warn) 22%, transparent); border-color: var(--warn); color: var(--warn); }
.cd-btn.busy, .ha-tile.busy, .ibtn.busy { opacity: 0.6; }
.cd-btn[data-result="fail"], .ha-tile[data-result="fail"], .ibtn[data-result="fail"] { box-shadow: 0 0 0 2px var(--danger); }
.cd-btn[data-result="ok"], .ibtn[data-result="ok"] { box-shadow: 0 0 0 2px var(--success); }
.pill { font-size: 10px; font-weight: 800; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 999px; background: var(--field); color: var(--ink-dim); margin-left: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.ok { color: var(--success); }
.pill.off { color: var(--ink-faint); }
.pill.rec, .pill.live { background: var(--danger); color: #fff; animation: pulse 1.6s ease-in-out infinite; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--field); color: var(--ink-mid); font: inherit; font-size: clamp(10px, 4cqmin, 12px); font-weight: 600; border-radius: 999px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
.chip.on { border-color: color-mix(in srgb, var(--success) 60%, transparent); color: var(--ink); }
.chip.muted-in { border-color: color-mix(in srgb, var(--danger) 60%, transparent); color: var(--danger); }
.cd-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.ibtn { appearance: none; border: 1px solid var(--line); background: var(--field); color: var(--ink); font-size: 13px; width: 30px; height: 30px; border-radius: 9px; cursor: pointer; flex: none; }
.ibtn.go { color: var(--success); }

.w-obs { gap: 6px; }
.obs-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; }
.obs-scenes { flex: 1; min-height: 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(max(84px, 22cqw), 1fr)); grid-auto-rows: minmax(36px, 1fr); gap: 6px; }
.obs-scene.on { background: var(--accent); color: #04121c; border-color: transparent; }
.obs-bar { display: flex; gap: 6px; }
.obs-bar .cd-btn { flex: 1; flex-direction: row; gap: 6px; padding: 7px 6px; }
.obs-bar .cd-ico { font-size: 13px; }

.w-ha { gap: 6px; }
.ha-grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(max(86px, 30cqw), 1fr)); grid-auto-rows: minmax(64px, 1fr); gap: 6px; }
.ha-tile { appearance: none; position: relative; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; border-radius: 14px; padding: 8px 10px; display: flex; flex-direction: column; justify-content: flex-end; text-align: left; cursor: pointer; min-width: 0; min-height: 0; transition: background 0.2s, border-color 0.2s; }
.ha-tile .ha-ico { position: absolute; top: 8px; right: 10px; font-size: 18px; line-height: 1; filter: grayscale(0.7); opacity: 0.8; }
.ha-tile .ha-name { font-size: 12px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 2px; }
.ha-tile .ha-state { font-size: 11px; color: var(--ink-dim); }
.ha-tile.on { background: color-mix(in srgb, var(--warn) 16%, var(--field)); border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
.ha-tile.on .ha-ico { filter: none; opacity: 1; }
.ha-tile.on .ha-state { color: var(--warn); }
.ha-tile[data-domain="lock"].on { background: color-mix(in srgb, var(--danger) 14%, var(--field)); border-color: color-mix(in srgb, var(--danger) 55%, transparent); }
.ha-tile[data-domain="lock"].on .ha-state { color: var(--danger); }
.ha-tile.ro { cursor: default; }
.ha-tile.ro .ha-state { color: var(--ink); font-size: 15px; font-weight: 700; }
.ha-tile.gone { opacity: 0.5; }

.ct-row { display: flex; align-items: center; gap: 7px; font-size: clamp(11px, 4.2cqmin, 13px); min-width: 0; }
.ct-row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ct-row .grow b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ct-sub { font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ct-row[data-state="running"] .sess-dot, .svc[data-state="running"] .sess-dot { background: var(--success); }
.svc[data-state="failed"] .sess-dot { background: var(--danger); }
.svc { display: flex; flex-direction: column; gap: 3px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
.svc:last-child { border-bottom: 0; }
.svc-out { margin: 0 0 0 16px; font-family: var(--mono); font-size: 10px; color: var(--ink-dim); white-space: pre; text-overflow: ellipsis; max-height: 3.2em; overflow: hidden; }
.svc[data-state="failed"] .svc-out { color: #fda4af; }

.w-meeting { gap: 6px; }
.mt-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(max(64px, 30cqw), 1fr)); grid-auto-rows: 1fr; gap: 6px; }
.mt-leave { color: #fecdd3; border-color: color-mix(in srgb, var(--danger) 50%, transparent); }
.mt-all { grid-column: 1 / -1; flex-direction: row; gap: 8px; }
.mt-all.on { background: var(--danger); border-color: transparent; color: #fff; }

.w-keys { gap: 6px; }
.keys-row { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(max(80px, 30cqw), 1fr)); grid-auto-rows: 1fr; gap: 6px; }
.keys-row .setup { grid-column: 1 / -1; }

.w-trackpad { gap: 6px; }
.tp-surface { flex: 1; min-height: 0; border-radius: 12px; background: repeating-linear-gradient(45deg, transparent 0 10px, rgba(255, 255, 255, 0.015) 10px 20px), var(--field); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; touch-action: none; cursor: crosshair; transition: border-color 0.2s; }
.tp-surface.touching { border-color: var(--accent); }
.tp-hint { font-size: 11px; color: var(--ink-faint); text-align: center; padding: 10px; pointer-events: none; }
.tp-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; height: max(36px, 16%); }
.w-trackpad.off .tp-surface { opacity: 0.4; }
/* Short tiles: icon beside the label so nothing clips. */
@container (max-height: 240px) {
  .mt-grid .cd-btn, .keys-row .cd-btn { flex-direction: row; gap: 6px; padding: 4px 6px; }
  .mt-grid .cd-ico, .keys-row .cd-ico { font-size: 15px; }
}
@container (max-height: 150px) {
  .w-meeting > .w-title, .w-keys > .w-title { display: none; }
}
@container (max-width: 260px) {
  .ct-row { gap: 5px; }
  .ct-row .ibtn { width: 26px; height: 26px; font-size: 12px; border-radius: 8px; }
  .ct-row .sess-dot { width: 7px; height: 7px; }
  .svc-out { margin-left: 12px; }
}
.w-containers .cd-head { margin-bottom: 6px; }
/* Short screens: scenes keep their height and the body scrolls instead of overlapping. */
.obs-scenes { flex: 1 0 auto; }
.tp-surface { overflow: hidden; }
@container (max-height: 170px) { .tp-hint { display: none; } }
/* Narrow services tile: buttons move under the name. */
@container (max-width: 220px) {
  .svc .ct-row { flex-wrap: wrap; row-gap: 4px; }
  .svc .ct-row .grow { flex-basis: calc(100% - 14px); }
  .svc .ct-row .ibtn:first-of-type { margin-left: auto; }
}

/* --- Stage 12: audio and system --- */
.w-mixer { gap: 6px; }
.mx-rows { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.mx-row { display: grid; grid-template-columns: 26px minmax(54px, 26%) 1fr 30px 30px; align-items: center; gap: 7px; font-size: clamp(11px, 4cqmin, 13px); }
.mx-ico { width: 26px; height: 26px; border-radius: 8px; background: var(--accent-faint); color: var(--accent-soft); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.mx-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.mx-track { position: relative; height: 26px; display: flex; align-items: center; }
.mx-meter { position: absolute; left: 2px; right: 2px; bottom: 0; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--success), var(--warn) 75%, var(--danger)); transform-origin: left; transform: scaleX(0); transition: transform 0.2s linear; pointer-events: none; }
.mx-track input { position: relative; width: 100%; margin: 0; }
.mx-num { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-dim); }
.mx-row[data-muted="1"] .mx-name, .mx-row[data-muted="1"] .mx-num { color: var(--ink-faint); text-decoration: line-through; }
.mx-row[data-muted="1"] .mx-mute { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, transparent); }
.mx-note { font-size: 11px; padding-top: 2px; }
@container (max-width: 300px) { .mx-row { grid-template-columns: 22px 1fr 30px; } .mx-row .mx-name, .mx-row .mx-num { display: none; } }

.w-devices { gap: 6px; }
.dv-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.dv-sec { display: flex; flex-direction: column; gap: 5px; }
.dv-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--ink-mid); }
.dv-sec[data-muted="1"] .dv-mute { color: var(--danger); }
.dv-list { display: flex; flex-direction: column; gap: 4px; }
.dv-dev { appearance: none; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; font-size: clamp(11px, 4cqmin, 13px); text-align: left; border-radius: 10px; padding: 6px 9px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.dv-dev span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dv-dev i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink-faint); flex: none; }
.dv-dev.on { border-color: var(--accent); }
.dv-dev.on i { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 2px var(--field); }
.dv-dev:disabled { cursor: default; opacity: 0.85; }

.w-ptt { gap: 4px; }
.ptt-btn { flex: 1; min-height: 0; appearance: none; border: 2px solid var(--line); background: var(--field); color: var(--ink); font: inherit; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; touch-action: none; -webkit-touch-callout: none; transition: background 0.15s, border-color 0.15s, transform 0.1s; }
.ptt-ico { font-size: clamp(20px, 22cqmin, 54px); line-height: 1; }
.ptt-lbl { font-weight: 750; font-size: clamp(11px, 6cqmin, 16px); }
.ptt-btn.live { background: color-mix(in srgb, var(--success) 28%, var(--field)); border-color: var(--success); transform: scale(0.98); box-shadow: 0 0 0 6px color-mix(in srgb, var(--success) 18%, transparent); }
.ptt-btn.live .ptt-lbl::after { content: " · live"; color: var(--success); }
.w-ptt.off .ptt-btn { opacity: 0.45; }

.duck.on { background: color-mix(in srgb, var(--warn) 18%, var(--field)); border-color: var(--warn); color: var(--warn); }
.br-rows { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.br-rows .vol-row { display: grid; grid-template-columns: minmax(70px, 34%) 1fr 40px; align-items: center; gap: 8px; }
.br-name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-mid); }
.cd-btn.hold { position: relative; overflow: hidden; touch-action: none; -webkit-touch-callout: none; }
.hold-fill { position: absolute; inset: 0; background: color-mix(in srgb, var(--accent) 30%, transparent); transform: scaleX(0); transform-origin: left; pointer-events: none; }
.cd-btn.hold.holding .hold-fill { transform: scaleX(1); transition: transform 1s linear; }
.cd-msg.hint { color: var(--ink-faint); text-align: center; }
.dv-sec .vol-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
.dv-sec .vol-row input { min-width: 0; width: 100%; }
.dv-sec .vol-num { font-size: 13px; min-width: 4ch; }

/* --- Stage 14: 3D printers --- */
/* The page widget lays out its own cards; the single one uses the tile itself. */
.w:has(> .w-printers:not(.w-printer)) { background: transparent; border-color: transparent; box-shadow: none; }
.w-printers:not(.w-printer) { padding: 0; }
.w-printer .pr-card { background: none; border: 0; padding: 0; border-radius: 0; }
.pr-grid { height: 100%; display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); grid-auto-rows: 1fr; }
.w-printers[data-count="4"] .pr-grid { grid-template-columns: 1fr 1fr; }
.pr-card { container-type: size; min-height: 0; background: var(--surface); border: var(--tile-border, 1px solid var(--line)); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.w-printer .pr-card { height: 100%; }
.w:has(> .w-printer) .pr-card[data-state="error"] { border: 0; }
.w:has(> .w-printer[data-err="1"]) { border-color: var(--danger); }
.pr-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pr-name { font-weight: 750; font-size: clamp(12px, 5cqmin, 17px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-state { font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--field); color: var(--ink-dim); white-space: nowrap; }
.pr-card[data-state="printing"] .pr-state { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent-soft); }
.pr-card[data-state="paused"] .pr-state, .pr-card[data-state="busy"] .pr-state { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.pr-card[data-state="finished"] .pr-state { background: color-mix(in srgb, var(--success) 22%, transparent); color: var(--success); }
.pr-card[data-state="error"] { border-color: var(--danger); }
.pr-card[data-state="error"] .pr-state { background: var(--danger); color: #fff; }
.pr-card[data-state="offline"] { opacity: 0.6; }
.pr-brand { font-size: 10px; margin-top: -4px; }
.pr-main { flex: 1; min-height: 0; display: flex; align-items: center; gap: 12px; }
.pr-progress { position: relative; height: min(100%, 46cqw, 58cqh); aspect-ratio: 1; flex: none; display: grid; place-items: center; }
.pr-ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.pr-ring .t-track { fill: none; stroke: var(--field); stroke-width: 9; }
.pr-ring .t-fill { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 0.6s; }
.pr-card[data-state="paused"] .pr-ring .t-fill { stroke: var(--warn); }
.pr-card[data-state="finished"] .pr-ring .t-fill { stroke: var(--success); }
.pr-pct { position: relative; font-weight: 800; font-size: clamp(14px, 11cqmin, 32px); font-variant-numeric: tabular-nums; }
.pr-pct small { font-size: 0.5em; color: var(--ink-dim); }
.pr-idle { font-size: clamp(22px, 18cqmin, 48px); color: var(--ink-faint); width: min(46cqw, 58cqh); text-align: center; flex: none; }
.pr-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: clamp(11px, 4.4cqmin, 14px); }
.pr-left { font-weight: 750; font-size: clamp(12px, 5.5cqmin, 18px); }
.pr-eta, .pr-file { font-size: clamp(10px, 3.8cqmin, 12px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr-layer { color: var(--ink-mid); font-variant-numeric: tabular-nums; }
.pr-error { color: var(--danger); font-weight: 700; font-size: 12px; }
.pr-temps { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: clamp(10px, 4cqmin, 13px); font-variant-numeric: tabular-nums; color: var(--ink-mid); }
.pr-temps small { color: var(--ink-faint); }
.pr-slots { display: flex; gap: 6px; }
.pr-slot { flex: 1; max-width: 46px; height: clamp(16px, 9cqh, 26px); border-radius: 6px; background: var(--c); border: 2px solid transparent; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15); }
.pr-slot b { font-size: 8px; font-weight: 800; color: var(--on, #fff); }
.pr-slot.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--accent); }
.pr-info .pr-temps { margin-top: 4px; }
.pr-info .pr-slots { margin-top: 4px; }
@container (max-height: 150px) { .pr-brand, .pr-eta { display: none; } }
@container (max-height: 110px) { .pr-slots, .pr-file { display: none; } }
/* Narrow printer cards (phone portrait): ring on top, details below, and the card scrolls. */
@container (max-width: 260px) {
  .pr-card .pr-main { flex-direction: column; align-items: flex-start; gap: 6px; }
  .pr-card .pr-progress { height: 64px; }
  .pr-card .pr-idle { width: auto; font-size: 28px; }
  .pr-card .pr-pct { font-size: 17px; }
  .pr-card .pr-info { width: 100%; }
  .pr-card .pr-temps small, .pr-card .pr-eta, .pr-card .pr-brand { display: none; }
  .pr-card .pr-temps { gap: 2px 8px; }
}
.pr-card { overflow-y: auto; scrollbar-width: none; }
/* A tall printers widget (phone portrait): one printer per row. */
@container (max-aspect-ratio: 4/5) { .w-printers .pr-grid { grid-template-columns: 1fr !important; } }

/* --- Stage 15: games, photo frame, camera --- */
.w-nowgame { padding: 0; }
.ng-art, .gm-art { background: linear-gradient(150deg, hsl(var(--h, 210) 55% 34%), hsl(calc(var(--h, 210) + 40) 60% 18%)); background-size: cover; background-position: center; position: relative; }
.ng-art { position: absolute; inset: 0; }
.ng-art:not(.has-art)::after, .gm-art:not(.has-art)::after { content: attr(data-title); position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 10%; font-weight: 800; color: rgba(255, 255, 255, 0.85); font-size: clamp(11px, 9cqmin, 26px); }
.ng-shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.1) 55%, transparent); }
.ng-text { position: absolute; left: 12px; right: 12px; bottom: 10px; }
.ng-label { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--success); }
.w-nowgame[data-idle="1"] .ng-label { color: var(--ink-dim); }
.ng-name { font-weight: 800; font-size: clamp(14px, 9cqmin, 26px); line-height: 1.15; }
.ng-time { font-size: 12px; color: var(--ink-mid); font-variant-numeric: tabular-nums; }
.w-games { gap: 6px; }
.gm-row { flex: 1; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(70px, 1fr); gap: 8px; overflow-x: auto; scrollbar-width: none; }
.gm-tile { appearance: none; border: 0; background: none; color: inherit; font: inherit; padding: 0; display: flex; flex-direction: column; gap: 3px; min-width: 0; min-height: 0; cursor: pointer; text-align: left; }
.gm-art { flex: 1; min-height: 40px; border-radius: 10px; overflow: hidden; container-type: size; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
.gm-tile.on .gm-art { box-shadow: 0 0 0 2px var(--success); }
.gm-name { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gm-meta { font-size: 10px; }
.gm-friends { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gm-friends:empty { display: none; }
.w-frame, .w-camera { padding: 0; background: #000; }
.pf-img, .cam-img { position: absolute; inset: 0; background-size: cover; background-position: center; background-repeat: no-repeat; }
.w-frame[data-fit="contain"] .pf-img { background-size: contain; }
.pf-img { opacity: 0; transition: opacity 1.2s ease; }
.pf-img.on { opacity: 1; }
.pf-msg, .cam-msg { position: relative; z-index: 1; margin: auto; }
.pf-msg:empty, .cam-msg:empty { display: none; }
.cam-img { background-size: contain; }
.cam-bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; padding: 6px 10px; font-size: 11px; background: linear-gradient(0deg, rgba(0, 0, 0, 0.7), transparent); }
.cam-title { font-weight: 700; }
.ng-art:not(.has-art)::after { content: none; }
.kv[data-level="warn"] .v { color: var(--warn); }

/* --- Stage 17: creative app controls --- */
.cr-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 6px; }
.cr-key .cd-ico { font-size: clamp(14px, 8cqmin, 22px); }
.cr-key.on { background: var(--accent-faint); border-color: var(--accent); }
.cr-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.cr-head .w-title { margin-bottom: 0; }
.cr-val { font-weight: 800; font-size: clamp(16px, 12cqh, 30px); font-variant-numeric: tabular-nums; }
.cr-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.cr-row input[type="range"] { flex: 1; min-width: 0; }
.cr-chip { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); flex: none; }
.cr-sw { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 6px; }
.sw { appearance: none; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; background: var(--c); min-height: 22px; cursor: pointer; }
.cr-hue { accent-color: var(--accent); background: linear-gradient(90deg, red, yellow, lime, cyan, blue, magenta, red); border-radius: 6px; height: 8px; appearance: none; }
.w-blender { gap: 6px; }
.bl-modes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.bl-modes .cd-btn { padding: 6px 2px; }
.bl-sliders { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 12px; align-content: start; }
.bl-sl { display: grid; grid-template-columns: 64px 1fr 44px; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-dim); }
.bl-sl b { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
@container (max-width: 330px) { .bl-modes { grid-template-columns: repeat(3, 1fr); } }
</style>
