<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DeskAssist panel</title>
<style>/* DeskAssist panel. Palette mirrors mobile/src/theme.ts. */
:root {
  --bg: #070b14;
  --surface: #0e1626;
  --field: #16233a;
  --line: rgba(255, 255, 255, 0.09);
  --ink: #e8eef9;
  --ink-mid: #cdd7e8;
  --ink-dim: #8a99b2;
  --ink-faint: #6b7a94;
  --accent: #38bdf8;
  --accent-soft: #7dd3fc;
  --accent-faint: rgba(56, 189, 248, 0.16);
  --success: #34d399;
  --danger: #fb7185;
  --warn: #fbbf24;
  --radius: 16px;
  --gap: 8px;
  --pad: 12px;
  --page-pad: 10px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  touch-action: manipulation;
}

:root { --nav-h: 18px; }

#pages {
  position: absolute;
  inset: 0;
  overflow: hidden;
  touch-action: pan-y;
}

.page {
  position: absolute;
  inset: 0;
  padding: var(--page-pad);
  padding-top: max(var(--page-pad), env(safe-area-inset-top));
  padding-bottom: calc(max(var(--page-pad), env(safe-area-inset-bottom)) + var(--nav-h));
  padding-left: max(var(--page-pad), env(safe-area-inset-left));
  padding-right: max(var(--page-pad), env(safe-area-inset-right));
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  will-change: transform;
}
.page.dragging { transition: none; }

.page-grid {
  display: grid;
  gap: var(--gap);
  width: 100%;
  height: 100%;
}

.empty {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-faint);
  font-size: 14px;
  text-align: center;
  padding: 24px;
}

/* Portrait pages may be taller than the screen: let them scroll. */
@media (orientation: portrait) {
  .page { overflow-y: auto; }
  .page-grid { height: auto; min-height: 100%; grid-auto-rows: calc((100vh - 2 * var(--page-pad) - var(--nav-h)) / 12); }
}

/* --- page dots --- */
#dots {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: max(2px, env(safe-area-inset-bottom));
  height: var(--nav-h);
  display: flex;
  align-items: center;
  gap: 2px;
  z-index: 10;
}
#dots[hidden] { display: none; }
.dot {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 6px 5px;
  cursor: pointer;
}
.dot::after {
  content: "";
  display: block;
  width: 6px;
  height: 6px;
  border-radius: 99px;
  background: var(--ink-faint);
  opacity: 0.55;
  transition: width 0.2s, background 0.2s, opacity 0.2s;
}
.dot[aria-current="page"]::after { width: 16px; background: var(--accent); opacity: 1; }

/* --- page overview --- */
#overview {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(7, 11, 20, 0.86);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  padding: max(20px, env(safe-area-inset-top)) 20px 20px;
  overflow-y: auto;
}
#overview[hidden] { display: none; }
.ov-title { color: var(--ink-dim); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.ov-card {
  appearance: none;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  color: var(--ink);
  font: inherit;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
}
.ov-card[aria-current="page"] { border-color: var(--accent); background: var(--accent-faint); }
.ov-name { font-weight: 650; font-size: 15px; }
.ov-meta { color: var(--ink-faint); font-size: 12px; }

/* --- demo label --- */
#banner {
  position: fixed;
  top: max(4px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--warn);
  background: rgba(251, 191, 36, 0.12);
  border: 1px solid rgba(251, 191, 36, 0.3);
  border-radius: 99px;
  padding: 2px 10px;
  pointer-events: none;
}
#banner[hidden] { display: none; }

.w {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.w-body {
  position: absolute;
  inset: 0;
  padding: var(--pad);
  container-type: size;
  display: flex;
  flex-direction: column;
}

.w-missing {
  align-items: center;
  justify-content: center;
  color: var(--ink-faint);
  font-size: 12px;
  text-align: center;
}

/* --- status dot --- */
#status {
  position: fixed;
  top: max(6px, env(safe-area-inset-top));
  right: max(8px, env(safe-area-inset-right));
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ink-faint);
  z-index: 20;
  opacity: 0.8;
}
#status[data-online="1"] { background: var(--success); }
#status[data-online="0"] { background: var(--danger); }

/* --- clock --- */
.w-clock { justify-content: center; align-items: center; text-align: center; }
.clock-time {
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  font-size: clamp(18px, min(38cqh, 17cqw), 220px);
  line-height: 1;
}
.clock-date {
  margin-top: 4cqh;
  color: var(--ink-dim);
  font-size: clamp(11px, min(11cqh, 6cqw), 40px);
}

/* --- metric --- */
.w-metric { justify-content: space-between; }
.metric-label {
  color: var(--ink-dim);
  font-size: clamp(11px, min(14cqh, 9cqw), 28px);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.metric-value {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  line-height: 1;
}
.metric-value .num { font-size: clamp(20px, min(42cqh, 28cqw), 160px); }
.metric-value .unit { font-size: clamp(12px, min(18cqh, 12cqw), 60px); color: var(--ink-dim); margin-left: 2px; }
.metric-bar {
  height: max(4px, 5cqh);
  border-radius: 99px;
  background: var(--field);
  overflow: hidden;
}
.metric-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: inherit;
  transition: width 0.6s ease;
}
.w-metric[data-level="mid"] .metric-fill { background: var(--warn); }
.w-metric[data-level="high"] .metric-fill { background: var(--danger); }

/* --- deck tiles --- */
.w .w-deck { padding: calc(var(--pad) * 0.6); }
.deck-grid { flex: 1; display: grid; gap: 6px; min-height: 0; }
.deck-msg { margin: auto; color: var(--ink-faint); font-size: 12px; text-align: center; max-width: 30em; }
.deck-tile {
  appearance: none;
  border: 0;
  border-radius: 12px;
  background: var(--tile);
  color: #fff;
  font: inherit;
  min-width: 0;
  min-height: 0;
  container-type: size;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4%;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 2px 6px rgba(0, 0, 0, 0.3);
  transition: transform 0.12s ease, filter 0.2s;
}
.deck-tile.pressed { transform: scale(0.93); filter: brightness(1.15); }
.deck-tile[data-result="fail"] { box-shadow: 0 0 0 2px var(--danger); }
.deck-icon { font-size: clamp(14px, 38cqmin, 56px); line-height: 1; }
.deck-icon img { width: 1.1em; height: 1.1em; object-fit: contain; display: block; }
.deck-label {
  font-size: clamp(9px, 13cqmin, 15px);
  font-weight: 650;
  max-width: 92%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
}

/* --- shared list widgets --- */
.w-title { color: var(--ink-dim); font-size: clamp(10px, 4.5cqmin, 14px); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.w-list .list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.muted { color: var(--ink-faint); }
.minibar { height: 5px; border-radius: 99px; background: var(--field); overflow: hidden; margin-top: 4px; }
.minibar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width 0.6s ease; }
[data-level="mid"] .minibar > i { background: var(--warn); }
[data-level="high"] .minibar > i { background: var(--danger); }
.w-metric[data-na="1"] .num { color: var(--ink-faint); }

/* --- gauge --- */
.w-gauge { align-items: center; justify-content: center; position: relative; }
.gauge-svg { width: 100%; height: 100%; }
.gauge-svg circle { fill: none; stroke-width: 9; stroke-linecap: round; }
.gauge-track { stroke: var(--field); }
.gauge-fill { stroke: var(--accent); transition: stroke-dasharray 0.6s ease; }
.w-gauge[data-level="mid"] .gauge-fill { stroke: var(--warn); }
.w-gauge[data-level="high"] .gauge-fill { stroke: var(--danger); }
.gauge-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.gauge-num { font-weight: 700; font-variant-numeric: tabular-nums; }
.gauge-num .num { font-size: clamp(16px, 22cqmin, 80px); }
.gauge-num .unit { font-size: clamp(10px, 9cqmin, 30px); color: var(--ink-dim); margin-left: 1px; }
.gauge-label { color: var(--ink-dim); font-size: clamp(9px, 7cqmin, 18px); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

/* --- chart --- */
.w-chart { gap: 4px; }
.chart-head { display: flex; gap: 12px; flex-wrap: wrap; font-size: clamp(10px, 6cqh, 14px); }
.chart-key b { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.chart-key.s0 b { background: var(--accent); }
.chart-key.s1 b { background: #c084fc; }
.chart-name { color: var(--ink-dim); }
.chart-val { font-weight: 650; font-variant-numeric: tabular-nums; }
.chart-svg, .net-chart { flex: 1; width: 100%; min-height: 0; }
.chart-line { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.chart-line.s0 { stroke: var(--accent); }
.chart-line.s1 { stroke: #c084fc; }
.chart-area { stroke: none; }
.chart-area.s0 { fill: rgba(56, 189, 248, 0.14); }
.chart-area.s1 { fill: rgba(192, 132, 252, 0.12); }

/* --- gpu / storage --- */
.gpu-card { background: var(--field); border-radius: 10px; padding: 8px 10px; }
.gpu-name { font-weight: 650; font-size: 13px; margin-bottom: 4px; }
.kv { display: grid; grid-template-columns: 1fr auto; font-size: 12px; margin-top: 3px; }
.kv .k { color: var(--ink-dim); }
.kv .minibar { grid-column: 1 / -1; }
.store-top { display: flex; justify-content: space-between; gap: 8px; font-size: clamp(11px, 4cqmin, 14px); }
.store-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.store-val { color: var(--ink-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* --- processes --- */
.w-procs .list { gap: 2px; }
.proc-row { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 5px 4px; border-radius: 6px; text-align: left; font-size: clamp(11px, 4cqmin, 14px); }
.w-processes .proc-row { cursor: pointer; }
.w-processes .proc-row:active { background: var(--field); }
.proc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proc-count { color: var(--ink-faint); }
.proc-val { font-variant-numeric: tabular-nums; color: var(--ink-mid); }
.proc-sheet { position: absolute; inset: 0; background: rgba(14, 22, 38, 0.97); padding: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
.proc-sheet[hidden] { display: none; }
.sheet-title { font-weight: 700; font-size: 16px; }
.sheet-msg { font-size: 13px; color: var(--ink-mid); min-height: 1.2em; }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.sheet-btn { appearance: none; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 10px; }
.sheet-btn.danger { color: #fff; background: #be123c; border-color: transparent; }

/* --- internet --- */
.w-internet { gap: 6px; }
.net-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: clamp(12px, 6cqh, 18px); }
.net-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-faint); }
.w-internet[data-state="up"] .net-dot { background: var(--success); }
.w-internet[data-state="down"] .net-dot { background: var(--danger); }
.net-ip { margin-left: auto; font-weight: 500; font-size: 12px; }
.net-stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.net-stats > div { display: flex; flex-direction: column; }
.net-stats .k { color: var(--ink-faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
.net-stats .v { font-weight: 650; font-variant-numeric: tabular-nums; font-size: clamp(11px, 5cqh, 16px); white-space: nowrap; }
.net-foot { display: flex; align-items: center; gap: 10px; font-size: 11px; }
.net-speed { flex: 1; text-align: right; }
.net-test { appearance: none; border: 1px solid var(--line); background: var(--field); color: var(--accent-soft); font: inherit; font-weight: 650; padding: 4px 10px; border-radius: 8px; }
@container (max-height: 120px) { .w-internet .net-chart, .w-internet .net-foot { display: none; } }
@container (max-width: 260px) { .net-stats > div:nth-child(n+4) { display: none; } .net-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
</style>

<div id="banner" hidden></div>
