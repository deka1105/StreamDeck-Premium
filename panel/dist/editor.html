<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskAssist — layout editor</title>
<style>:root {
  --bg: #070b14;
  --surface: #0e1626;
  --field: #16233a;
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.16);
  --ink: #e8eef9;
  --ink-dim: #8a99b2;
  --ink-faint: #6b7a94;
  --accent: #38bdf8;
  --accent-faint: rgba(56, 189, 248, 0.16);
  --danger: #fb7185;
  --success: #34d399;
  color-scheme: dark;
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
header {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--surface);
}
header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 700; }
header .spacer { flex: 1; }
#rev { color: var(--ink-dim); font-size: 12px; }
main { flex: 1; display: grid; grid-template-columns: 260px 1fr 300px; min-height: 0; }
aside { padding: 14px; overflow-y: auto; border-right: 1px solid var(--line); }
aside.right { border-right: 0; border-left: 1px solid var(--line); }
h2 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); margin: 0 0 10px; }
h3 { font-size: 13px; margin: 18px 0 8px; }
h4 { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 0 6px; }
.muted { color: var(--ink-faint); }
button, select, input, textarea {
  font: inherit; color: var(--ink); background: var(--field);
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px;
}
button { cursor: pointer; }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); color: #04121c; border-color: var(--accent); font-weight: 700; }
button.danger { color: var(--danger); }
button[aria-pressed="true"] { background: var(--accent-faint); border-color: var(--accent); }
label { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; color: var(--ink-dim); font-size: 12px; }
label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 13px; }
label.mini { margin: 0; }
label.mini input { width: 58px; }
select, input:not([type=checkbox]):not([type=radio]), textarea { width: 100%; }
.row { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
.boxrow { flex-wrap: nowrap; }
.page-list { list-style: none; padding: 0; margin: 0 0 8px; }
.page-list li { display: flex; align-items: center; gap: 4px; padding: 3px; border-radius: 8px; }
.page-list li.active { background: var(--accent-faint); }
.page-name { flex: 1; text-align: left; background: transparent; border: 0; padding: 6px 8px; }
.icon { padding: 2px 8px; background: transparent; border-color: transparent; color: var(--ink-dim); }
.tag { font-size: 10px; padding: 1px 6px; border-radius: 99px; background: var(--accent-faint); color: var(--accent); }
.tag.dim { background: var(--field); color: var(--ink-faint); }
#center { padding: 18px; display: flex; flex-direction: column; min-width: 0; }
#canvas, #previewFrame {
  width: 100%; aspect-ratio: 780 / 360; max-height: calc(100vh - 120px);
  border: 1px solid var(--line-strong); border-radius: 18px; background: #04070d;
}
#canvas { padding: 10px; }
#previewFrame[hidden], #canvas[hidden] { display: none; }
.canvas-grid {
  position: relative; display: grid; height: 100%;
  grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(6, 1fr); gap: 6px;
}
.cell { border: 1px dashed rgba(255, 255, 255, 0.05); border-radius: 6px; }
.cell { grid-column: auto; }
.wbox {
  position: relative; z-index: 1; background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: 12px; padding: 8px; cursor: grab; display: flex; flex-direction: column; justify-content: space-between;
  touch-action: none; user-select: none; overflow: hidden;
}
.wbox.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-faint); }
.wbox.dragging { cursor: grabbing; opacity: 0.9; }
.wbox.blocked { border-color: var(--danger); }
.wname { font-weight: 650; font-size: 12px; }
.wsize { color: var(--ink-faint); font-size: 11px; }
.resize { position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px; cursor: nwse-resize;
  border-right: 2px solid var(--ink-faint); border-bottom: 2px solid var(--ink-faint); border-radius: 0 0 6px 0; }
.canvas-empty { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); }
.palette-items { display: flex; flex-wrap: wrap; gap: 6px; }
.pitem { font-size: 12px; padding: 5px 9px; }
#flash {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 9;
  background: var(--surface); border: 1px solid var(--success); color: var(--ink);
  padding: 8px 14px; border-radius: 10px; max-width: 80vw;
}
#flash[data-bad="1"] { border-color: var(--danger); }
#flash[hidden] { display: none; }
.hint { color: var(--ink-faint); font-size: 12px; margin-top: 10px; }
#settingsView { overflow-y: auto; max-height: calc(100vh - 110px); padding-right: 6px; }
#settingsView[hidden] { display: none; }
.set-section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px 14px; margin-bottom: 14px; }
.set-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.set-row { display: flex; align-items: center; gap: 10px; background: var(--field); border-radius: 10px; padding: 8px 10px; }
.set-row .grow { flex: 1; min-width: 0; }
.set-row .small { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set-row input[type=color] { width: 30px; height: 30px; padding: 0; border: 0; background: none; }
.cal-status { font-size: 12px; max-width: 240px; }
.geo-results { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.row input { flex: 1; min-width: 120px; width: auto; }
body[data-view="settings"] aside.right { opacity: 0.4; pointer-events: none; }
.examples { background: #04070d; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 11px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; color: var(--ink-dim); }
#hookKey { word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>DeskAssist layout</h1>
  <select id="target" aria-label="Device"></select>
  <span id="rev"></span>
  <span class="spacer"></span>
  <button id="settingsToggle" aria-pressed="false">Settings</button>
  <button id="previewToggle" aria-pressed="false">Live preview</button>
  <button id="revert" disabled>Revert</button>
  <button id="save" class="primary" disabled>Save</button>
</header>
<main>
  <aside><h2>Pages</h2><div id="pages"></div><div id="pageSettings"></div></aside>
  <section id="center">
    <div id="canvas"></div>
    <iframe id="previewFrame" title="Live preview" hidden></iframe>
    <div id="settingsView" hidden></div>
    <p class="hint">Drag a widget to move it, drag its corner to resize. Delete removes the selected widget. ⌘/Ctrl-S saves.</p>
  </section>
  <aside class="right"><h2>Add a widget</h2><div id="palette"></div><h2 style="margin-top:20px">Selected widget</h2><div id="inspector"></div></aside>
</main>
