<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      /* Palette lifted from the project: site/index.html :root and
         mobile/src/buttons.ts TILE_COLORS. */
      :root {
        --ground: #070b14;
        --deck:   #0b1120;
        --ink:    #e8eef9;
        --muted:  #8a99b2;
        --accent: #46bdf6;
        --front:  #38bdf8;
        --good:   #4ade80;
        --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      }

      html, body {
        width: 1920px; height: 1080px;
        overflow: hidden; background: var(--ground);
      }
      #root {
        width: 100%; height: 100%;
        position: relative; background: var(--ground);
        font-family: var(--sans); color: var(--ink);
      }

      /* Every timed scene gets a full-frame box. */
      .clip { position: absolute; inset: 0; }

      /* ---------- shared tile look (the product's actual tile) ---------- */
      .tile {
        position: relative;
        border-radius: 26px;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 10px;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.42);
      }
      .tile .glyph { font-size: 44px; line-height: 1; }
      .tile .label {
        font-size: 21px; font-weight: 600; letter-spacing: -0.01em;
        color: #fff;
      }
      /* live status dot, top-left, as in the app */
      .dot {
        position: absolute; top: 14px; left: 14px;
        width: 15px; height: 15px; border-radius: 50%;
        background: var(--good); opacity: 0;
      }
      .dot.front { background: var(--front); }

      /* ---------- Scene 1 : the button ---------- */
      #s1 { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 62px; }
      #hero-tile {
        width: 340px; height: 340px;
        background: linear-gradient(160deg, #0ea5e9 0%, #0284c7 58%, #0369a1 100%);
        opacity: 0;
      }
      #hero-tile .glyph { font-size: 104px; }
      #hero-tile .label { font-size: 30px; }
      #ripple {
        position: absolute; left: 50%; top: 50%;
        width: 120px; height: 120px; margin: -60px 0 0 -60px;
        border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.75);
        opacity: 0;
      }
      #hero-line {
        font-size: 74px; font-weight: 300; letter-spacing: -0.015em;
        color: var(--ink); opacity: 0;
      }

      /* ---------- Scene 2 : the deck ---------- */
      #s2 { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 54px; }
      #deck {
        display: grid;
        grid-template-columns: repeat(3, 214px);
        grid-template-rows: repeat(3, 214px);
        gap: 20px;
        padding: 30px;
        border-radius: 40px;
        background: var(--deck);
        opacity: 0;
      }
      #deck .tile { width: 214px; height: 214px; opacity: 0; }
      #s2-caption {
        font-size: 44px; font-weight: 300; letter-spacing: 0.005em;
        color: var(--muted); opacity: 0;
      }

      /* ---------- Scene 3 : tap here, it types there ---------- */
      #s3 { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; }
      #s3-caption {
        font-size: 44px; font-weight: 300; color: var(--muted); opacity: 0;
      }
      #split { display: flex; align-items: center; gap: 96px; }

      #phone {
        display: grid;
        grid-template-columns: repeat(2, 150px);
        grid-template-rows: repeat(2, 150px);
        gap: 16px; padding: 24px;
        border-radius: 34px; background: var(--deck);
        opacity: 0;
      }
      #phone .tile { width: 150px; height: 150px; }
      #phone .tile .glyph { font-size: 34px; }
      #phone .tile .label { font-size: 16px; }
      #tap-ring {
        position: absolute; width: 150px; height: 150px;
        border-radius: 26px; border: 4px solid rgba(255, 255, 255, 0.85);
        opacity: 0; pointer-events: none;
      }

      #macwin {
        width: 720px; height: 356px;
        border-radius: 18px;
        background: #0e1626;
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: 0 26px 70px rgba(0, 0, 0, 0.5);
        opacity: 0; overflow: hidden;
      }
      #macbar {
        height: 42px; display: flex; align-items: center; gap: 9px;
        padding: 0 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      }
      #macbar i { width: 12px; height: 12px; border-radius: 50%; background: #2b3a52; display: block; }
      #macbody { padding: 34px 30px; }
      /* typewriter: overflow-hidden wrapper whose width is stepped by GSAP,
         with the caret as a border-right so it rides the reveal edge. */
      #typewrap {
        width: 0; max-width: 660px;
        overflow: hidden; white-space: nowrap;
        border-right: 3px solid var(--accent);
      }
      #typed {
        font-family: var(--mono);
        font-size: 31px; line-height: 1.35;
        color: var(--ink); white-space: pre;
      }

      /* ---------- Scene 4 : name and claim ---------- */
      #s4 { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
      #s4-deck {
        position: absolute; left: 50%; top: 50%;
        margin: -337px 0 0 -337px;
        width: 674px; height: 674px;
        border-radius: 40px; background: var(--deck);
        opacity: 0;
        filter: blur(7px);
      }
      #wordmark {
        position: relative;
        font-size: 108px; font-weight: 300; letter-spacing: 0.005em;
        color: var(--ink); opacity: 0;
      }
      #claim {
        position: relative;
        font-size: 40px; font-weight: 400; letter-spacing: 0.06em;
        text-transform: none; color: var(--muted); opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20"
         data-width="1920" data-height="1080">

      <!-- ================= Scene 1 — the button — 0 → 4.5 ================= -->
      <div id="s1" class="clip" data-start="0" data-duration="4.5">
        <div id="hero-tile" class="tile">
          <span class="glyph">🧭</span>
          <span class="label">Safari</span>
          <span id="ripple"></span>
        </div>
        <div id="hero-line">Your phone is the button.</div>
      </div>

      <!-- ================= Scene 2 — the deck — 4.3 → 10.2 ================= -->
      <div id="s2" class="clip" data-start="4.3" data-duration="5.9">
        <div id="deck">
          <div class="tile" data-t="0" style="background:linear-gradient(160deg,#0ea5e9,#0284c7)">
            <span class="dot" data-d="1"></span><span class="glyph">🧭</span><span class="label">Safari</span></div>
          <div class="tile" data-t="1" style="background:linear-gradient(160deg,#3b82f6,#2563eb)">
            <span class="dot front" data-d="1"></span><span class="glyph">💻</span><span class="label">VS Code</span></div>
          <div class="tile" data-t="2" style="background:linear-gradient(160deg,#6366f1,#4f46e5)">
            <span class="dot" data-d="1"></span><span class="glyph">📁</span><span class="label">Finder</span></div>
          <div class="tile" data-t="3" style="background:linear-gradient(160deg,#8b5cf6,#7c3aed)">
            <span class="glyph">🔍</span><span class="label">Spotlight</span></div>
          <div class="tile" data-t="4" style="background:linear-gradient(160deg,#d946ef,#c026d3)">
            <span class="glyph">📸</span><span class="label">Screenshot</span></div>
          <div class="tile" data-t="5" style="background:linear-gradient(160deg,#5a6b81,#475569)">
            <span class="glyph">🔒</span><span class="label">Lock</span></div>
          <div class="tile" data-t="6" style="background:linear-gradient(160deg,#525252,#404040)">
            <span class="glyph">🐙</span><span class="label">GitHub</span></div>
          <div class="tile" data-t="7" style="background:linear-gradient(160deg,#f43f5e,#e11d48)">
            <span class="glyph">▶️</span><span class="label">YouTube</span></div>
          <div class="tile" data-t="8" style="background:linear-gradient(160deg,#f59e0b,#d97706)">
            <span class="glyph">🔇</span><span class="label">Mute</span></div>
        </div>
        <div id="s2-caption">Nine tiles. One tap each.</div>
      </div>

      <!-- ========= Scene 3 — tap here, it types there — 10.0 → 15.6 ========= -->
      <div id="s3" class="clip" data-start="10.0" data-duration="5.6">
        <div id="s3-caption">Tap here. It types there.</div>
        <div id="split">
          <div id="phone">
            <div class="tile" style="background:linear-gradient(160deg,#0ea5e9,#0284c7)">
              <span class="glyph">🧭</span><span class="label">Safari</span></div>
            <div class="tile" style="background:linear-gradient(160deg,#6366f1,#4f46e5)">
              <span class="glyph">📁</span><span class="label">Finder</span></div>
            <div class="tile" style="background:linear-gradient(160deg,#8b5cf6,#7c3aed)">
              <span class="glyph">✎</span><span class="label">Thanks reply</span>
              <span id="tap-ring"></span></div>
            <div class="tile" style="background:linear-gradient(160deg,#f59e0b,#d97706)">
              <span class="glyph">🔇</span><span class="label">Mute</span></div>
          </div>
          <div id="macwin">
            <div id="macbar"><i></i><i></i><i></i></div>
            <div id="macbody">
              <div id="typewrap"><span id="typed">Thanks for the quick turnaround.</span></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ============== Scene 4 — name and claim — 15.4 → 20.0 ============== -->
      <div id="s4" class="clip" data-start="15.4" data-duration="4.6">
        <div id="s4-deck"></div>
        <div id="wordmark">DeskAssist</div>
        <div id="claim">No cloud. No account.</div>
      </div>

      <!-- ============================= audio ============================= -->
      <audio id="music" data-start="0" data-duration="20" data-volume="0.30"
             data-fade-in="0.6" data-fade-out="1.2" data-track-index="10"
             src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>

      <!-- grid completes — beat-locked 8.74s -->
      <audio id="sfx-grid" data-start="8.70" data-duration="0.6" data-volume="0.55"
             data-track-index="11" src="assets/sfx/impact/impactSoft_medium_000.ogg"></audio>
      <!-- the tap -->
      <audio id="sfx-tap" data-start="12.55" data-duration="0.4" data-volume="0.60"
             data-track-index="12" src="assets/sfx/interface/click_003.ogg"></audio>
      <!-- typing texture: 8 hits across the 1.9s type, fixed files (deterministic) -->
      <audio id="sfx-key-1" data-start="13.15" data-duration="0.3" data-volume="0.30" data-track-index="13" src="assets/sfx/keyboard/keypress-003.wav"></audio>
      <audio id="sfx-key-2" data-start="13.39" data-duration="0.3" data-volume="0.30" data-track-index="14" src="assets/sfx/keyboard/keypress-007.wav"></audio>
      <audio id="sfx-key-3" data-start="13.63" data-duration="0.3" data-volume="0.30" data-track-index="15" src="assets/sfx/keyboard/keypress-011.wav"></audio>
      <audio id="sfx-key-4" data-start="13.87" data-duration="0.3" data-volume="0.30" data-track-index="16" src="assets/sfx/keyboard/keypress-015.wav"></audio>
      <audio id="sfx-key-5" data-start="14.11" data-duration="0.3" data-volume="0.30" data-track-index="17" src="assets/sfx/keyboard/keypress-019.wav"></audio>
      <audio id="sfx-key-6" data-start="14.35" data-duration="0.3" data-volume="0.30" data-track-index="18" src="assets/sfx/keyboard/keypress-023.wav"></audio>
      <audio id="sfx-key-7" data-start="14.59" data-duration="0.3" data-volume="0.30" data-track-index="19" src="assets/sfx/keyboard/keypress-027.wav"></audio>
      <audio id="sfx-key-8" data-start="14.83" data-duration="0.3" data-volume="0.30" data-track-index="20" src="assets/sfx/keyboard/keypress-031.wav"></audio>
      <!-- the name lands -->
      <audio id="sfx-name" data-start="16.33" data-duration="0.6" data-volume="0.50"
             data-track-index="21" src="assets/sfx/interface/bong_001.ogg"></audio>
    </div>

    <script>
      // Beat grid (109.96 BPM) and strong cues from the bundled preset for
      // happy-beats-business-moves-vol-12. Cues bias timing; readability wins.
      const tl = gsap.timeline({ paused: true });

      /* ---------------- Scene 1 — the button ---------------- */
      tl.fromTo("#hero-tile",
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" }, 0.25);

      // tap ripple — biased to the 1.09s beat
      tl.fromTo("#ripple",
        { opacity: 0.85, scale: 0.35 },
        { opacity: 0, scale: 2.5, duration: 0.85, ease: "power2.out" }, 1.05);

      // the hook line — held settled ~1.9s, the longest read in the video
      tl.fromTo("#hero-line",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 1.70);
      tl.to("#hero-line", { opacity: 0, duration: 0.45 }, 4.15);
      tl.to("#hero-tile", { opacity: 0, scale: 0.97, duration: 0.5 }, 4.20);

      /* ---------------- Scene 2 — the deck ---------------- */
      tl.fromTo("#deck",
        { opacity: 0, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 4.40);

      // nine tiles on consecutive beats — no text to read, so ~0.5s spacing is safe
      // beat-grid: 4.39, 4.91, 5.34, 6.00, 6.56, 7.09, 7.64, 8.19, 8.74
      const tileBeats = [4.39, 4.91, 5.34, 6.00, 6.56, 7.09, 7.64, 8.19, 8.74];
      tileBeats.forEach(function (t, i) {
        tl.fromTo('#deck .tile[data-t="' + i + '"]',
          { opacity: 0, scale: 0.88 },
          { opacity: 1, scale: 1, duration: 0.42, ease: "power2.out" }, t);
      });
      // beat-locked: 8.74s — the grid is whole (strong cue, intensity 0.99)

      // status dots arrive as a softer second wave, after the grid is complete
      tl.to("#deck .dot[data-d]", { opacity: 1, duration: 0.4, ease: "power1.out" }, 8.95);

      // caption waits for the full grid, then holds ~1.3s
      tl.fromTo("#s2-caption",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 8.90);
      tl.to("#s2-caption", { opacity: 0, duration: 0.35 }, 9.95);
      tl.to("#deck", { opacity: 0, scale: 0.97, duration: 0.5 }, 9.80);

      /* ------- Scene 3 — tap here, it types there ------- */
      // caption first, so it never competes with the typing for attention
      tl.fromTo("#s3-caption",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 10.15);

      tl.fromTo("#phone",
        { opacity: 0, x: -26 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 10.30);
      tl.fromTo("#macwin",
        { opacity: 0, x: 26 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 10.55);

      // the tap on the "Thanks reply" tile
      tl.fromTo("#tap-ring",
        { opacity: 0.9, scale: 0.9 },
        { opacity: 0, scale: 1.5, duration: 0.7, ease: "power2.out" }, 12.55);

      // the payoff: text types itself on the Mac side.
      // width tween + steps() = per-character reveal; the border-right is the caret.
      // beat-locked: 13.11s (strong cue, intensity 0.98)
      tl.to("#typewrap",
        { width: 640, duration: 1.85, ease: "steps(32)" }, 13.11);

      tl.to("#s3-caption", { opacity: 0, duration: 0.35 }, 12.20);
      tl.to(["#phone", "#macwin"], { opacity: 0, duration: 0.5 }, 15.20);

      /* ---------------- Scene 4 — name and claim ---------------- */
      tl.to("#s4-deck", { opacity: 0.16, duration: 0.7, ease: "power1.out" }, 15.50);

      // the name — aligned to the 16.38s beat
      tl.fromTo("#wordmark",
        { opacity: 0, y: 16, scale: 0.985 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power2.out" }, 16.38);

      // the closing claim — beat-locked: 18.56s (strong cue, intensity 0.99)
      // 4 words, held 1.44s — above the reading floor
      tl.fromTo("#claim",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 18.56);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
